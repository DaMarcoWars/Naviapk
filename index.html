<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blinden-Fußgänger-Navi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #000;
      color: #FFF;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 15px;
    }
    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 15px;
      color: #FFD700;
    }
    .status-box {
      background-color: #1a1a1a;
      border: 3px solid #FFD700;
      border-radius: 12px;
      padding: 20px;
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn {
      width: 100%;
      padding: 22px 15px;
      font-size: 1.5rem;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      margin-bottom: 15px;
      cursor: pointer;
      color: #FFF;
      touch-action: manipulation;
    }
    .btn-primary { background-color: #0066CC; }
    .btn-primary:active { background-color: #004488; }
    .btn-success { background-color: #28A745; }
    .btn-success:active { background-color: #1E7E34; }
    .btn-warning { background-color: #D39E00; color: #000; }
    .btn-danger { background-color: #DC3545; }
    .btn-secondary { background-color: #4A5568; }
    .input-field {
      width: 100%;
      padding: 15px;
      font-size: 1.3rem;
      border-radius: 10px;
      border: 2px solid #CCC;
      margin-bottom: 15px;
      background-color: #222;
      color: #FFF;
    }
    .section { display: none; }
    .section.active { display: block; }
    .route-item {
      background: #222;
      border: 2px solid #555;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <h1>Fußgänger Navi</h1>

  <div id="status" class="status-box" role="status" aria-live="assertive">
    Bereit. Bitte wählen Sie eine Aktion.
  </div>

  <!-- Hauptmenü -->
  <div id="menuSection" class="section active">
    <button class="btn btn-primary" onclick="showSection('navSection'); prepareNavigation();">1. Navigation starten</button>
    <button class="btn btn-success" onclick="showSection('recSection'); prepareRecording();">2. Neuen Weg aufzeichnen</button>
    <button class="btn btn-secondary" onclick="showSection('manageSection'); renderRoutesList();">3. Wege verwalten & Teilen</button>
  </div>

  <!-- Navigation Section -->
  <div id="navSection" class="section">
    <button id="startNavBtn" class="btn btn-primary" onclick="toggleNavigation()">Navigation Starten</button>
    <button class="btn btn-warning" onclick="reverseCurrentRoute()">Weg umkehren (Rückweg)</button>
    <button class="btn btn-warning" onclick="announceCurrentState()">Wo bin ich? (Status ansagen)</button>
    <button class="btn btn-secondary" onclick="stopNavigation(); showSection('menuSection');">Zurück zum Hauptmenü</button>
  </div>

  <!-- Aufzeichnen Section -->
  <div id="recSection" class="section">
    <input type="text" id="routeNameInput" class="input-field" placeholder="Name des Weges" value="Mein Weg">
    <button id="recToggleBtn" class="btn btn-success" onclick="toggleRecording()">Aufnahme Starten</button>
    <button id="addWaypointBtn" class="btn btn-warning" style="display:none;" onclick="manualAddWaypoint()">Haupt-Wegpunkt / Hinweis hinzufügen</button>
    <button class="btn btn-secondary" onclick="stopRecording(); showSection('menuSection');">Zurück zum Hauptmenü</button>
  </div>

  <!-- Verwalten & Teilen Section -->
  <div id="manageSection" class="section">
    <h2 style="margin-bottom:15px;">Gespeicherte Wege</h2>
    
    <button class="btn btn-primary" onclick="importFromPrompt()">Weg aus Text-Code importieren</button>
    <button class="btn btn-success" onclick="triggerFileImport()">Weg aus Datei importieren</button>
    <input type="file" id="importFileInput" style="display:none;" accept=".json" onchange="handleFileImport(event)">

    <div id="routesList" style="margin-top: 15px; margin-bottom: 15px;"></div>
    <button class="btn btn-secondary" onclick="showSection('menuSection');">Zurück zum Hauptmenü</button>
  </div>

  <script>
    // --- KONFIGURATION & ZUSTAND ---
    const REC_DISTANCE_THRESHOLD = 6; // Automatischer Brotkrumen-Abstand in Metern
    const OFF_ROUTE_THRESHOLD = 15;   // Toleranzgrenze für Abweichung vom Weg in Metern

    let routes = JSON.parse(localStorage.getItem('navi_routes') || '[]');
    let currentRoute = null;
    let isNavigating = false;
    let isRecording = false;
    let navWatchId = null;
    let recWatchId = null;
    
    let currentTargetIndex = 0;
    let recPoints = [];
    let lastRecPosition = null;
    let initialSnapDone = false;
    let currentCompassHeading = null;
    let lastOffRouteWarnTime = 0;

    // --- KOMPASS SENSOR INITIALISIERUNG ---
    function initCompass() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          }
        }).catch(console.error);
      } else {
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        } else if ('ondeviceorientation' in window) {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
      }
    }

    function handleOrientation(event) {
      if (event.webkitCompassHeading) {
        currentCompassHeading = event.webkitCompassHeading;
      } else if (event.alpha !== null && event.alpha !== undefined) {
        currentCompassHeading = (360 - event.alpha) % 360;
      }
    }

    // --- ALLGEMEINE HILFSFUNKTIONEN ---
    function speak(text) {
      document.getElementById('status').innerText = text;
      try {
        if ('speechSynthesis' in window && window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const msg = new SpeechSynthesisUtterance(text);
          msg.lang = 'de-DE';
          msg.rate = 1.0;
          window.speechSynthesis.speak(msg);
        }
      } catch (e) {
        console.log("Sprachausgabe-Fehler:", e);
      }
    }

    function vibrate(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function showSection(sectionId) {
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      const θ = Math.atan2(y, x);
      return (θ * 180 / Math.PI + 360) % 360;
    }

    function getDirectionText(lat1, lon1, lat2, lon2, gpsHeading) {
      const bearing = getBearing(lat1, lon1, lat2, lon2);
      let heading = (gpsHeading !== null && gpsHeading !== undefined && !isNaN(gpsHeading)) 
                    ? gpsHeading 
                    : currentCompassHeading;

      if (heading !== null && heading !== undefined && !isNaN(heading)) {
        let relAngle = (bearing - heading + 360) % 360;
        let clock = Math.round(relAngle / 30);
        if (clock === 0 || clock === 12) clock = 12;
        return `auf ${clock} Uhr`;
      } else {
        return `geradeaus`;
      }
    }

    // Hilfsfunktion: Prüft, ob ein Punkt ein Haupt-Wegpunkt ist
    function isKeyPoint(point, idx, totalLength) {
      if (point.isKey !== undefined) return point.isKey;
      // Abwärtskompatibilität für alte Wege:
      if (idx === 0 || idx === totalLength - 1) return true;
      if (point.text && !point.text.startsWith("Wegpunkt ")) return true;
      return false;
    }

    // Findet den nächsten Haupt-Wegpunkt ab dem aktuellen Index
    function getNextKeyIndex(startIndex, points) {
      for (let i = startIndex; i < points.length; i++) {
        if (isKeyPoint(points[i], i, points.length)) return i;
      }
      return points.length - 1;
    }

    // --- NAVIGATION ---
    function prepareNavigation() {
      initCompass();
      if (routes.length === 0) {
        speak("Keine gespeicherten Wege vorhanden. Bitte zeichnen Sie zuerst einen Weg auf.");
        showSection('menuSection');
        return;
      }
      currentRoute = routes[routes.length - 1];
      currentTargetIndex = 0;
      initialSnapDone = false;
      speak(`Weg gewählt: ${currentRoute.name}. Bereit zum Starten.`);
    }

    function toggleNavigation() {
      if (isNavigating) stopNavigation();
      else startNavigation();
    }

    function startNavigation() {
      if (!currentRoute || currentRoute.points.length === 0) {
        speak("Fehler: Keine Wegpunkte vorhanden.");
        return;
      }

      isNavigating = true;
      document.getElementById('startNavBtn').innerText = "Navigation Stoppen";
      document.getElementById('startNavBtn').className = "btn btn-danger";
      speak("Suche GPS-Signal. Bitte warten.");

      navWatchId = navigator.geolocation.watchPosition(
        onNavPosition,
        onGeoError,
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    function reverseCurrentRoute() {
      if (!currentRoute) {
        speak("Kein Weg ausgewählt.");
        return;
      }
      currentRoute.points.reverse();
      currentTargetIndex = 0;
      initialSnapDone = false;
      speak("Weg wurde umgekehrt. Start und Ziel sind jetzt vertauscht. Bereit für den Rückweg.");
    }

    function onNavPosition(pos) {
      const uLat = pos.coords.latitude;
      const uLon = pos.coords.longitude;
      const heading = pos.coords.heading;
      const points = currentRoute.points;

      // 1. Nächstgelegenen Punkt auf der Spur finden (Fortschritt messen)
      let minTrackDist = Infinity;
      let closestIdx = currentTargetIndex;

      for (let i = 0; i < points.length; i++) {
        const d = getDistance(uLat, uLon, points[i].lat, points[i].lon);
        if (d < minTrackDist) {
          minTrackDist = d;
          closestIdx = i;
        }
      }

      // Erstes Einrasten beim Start der Navigation
      if (!initialSnapDone) {
        currentTargetIndex = closestIdx;
        initialSnapDone = true;
        
        const keyIdx = getNextKeyIndex(currentTargetIndex, points);
        const keyTarget = points[keyIdx];
        const distToKey = Math.round(getDistance(uLat, uLon, keyTarget.lat, keyTarget.lon));
        const dirText = getDirectionText(uLat, uLon, keyTarget.lat, keyTarget.lon, heading);
        const nameText = keyTarget.text || `Haupt-Wegpunkt ${keyIdx + 1}`;

        speak(`Navigation gestartet. Nächster Haupt-Wegpunkt: ${nameText}. Noch ${distToKey} Meter ${dirText}.`);
        vibrate([100, 50, 100]);
        return;
      }

      // Fortschritt aktualisieren (nur vorwärts bewegen)
      if (closestIdx >= currentTargetIndex) {
        currentTargetIndex = closestIdx;
      }

      // 2. Abweichungs-Prüfung (Off-Route Schutz)
      if (minTrackDist > OFF_ROUTE_THRESHOLD) {
        const now = Date.now();
        if (now - lastOffRouteWarnTime > 12000) { // Max. alle 12 Sekunden warnen
          lastOffRouteWarnTime = now;
          const keyIdx = getNextKeyIndex(currentTargetIndex, points);
          const keyTarget = points[keyIdx];
          const dirText = getDirectionText(uLat, uLon, keyTarget.lat, keyTarget.lon, heading);
          
          speak(`Achtung: Du bist vom Weg abgekommen! Der nächste Wegpunkt liegt ca. ${Math.round(minTrackDist)} Meter entfernt ${dirText}.`);
          vibrate([300, 100, 300, 100, 300]);
        }
        return; // Ankunftsprüfung überspringen, solange man abseits ist
      }

      // 3. Ankunft am nächsten HAUPT-Wegpunkt prüfen
      const keyIdx = getNextKeyIndex(currentTargetIndex, points);
      const keyTarget = points[keyIdx];
      const distToKey = getDistance(uLat, uLon, keyTarget.lat, keyTarget.lon);

      if (distToKey < 7) {
        vibrate([300, 100, 300]);
        let msg = `Erreicht: ${keyTarget.text || ('Haupt-Wegpunkt ' + (keyIdx + 1))}. `;

        if (keyIdx < points.length - 1) {
          // Weiter zum nächsten Haupt-Wegpunkt springen
          currentTargetIndex = keyIdx + 1;
          const nextKeyIdx = getNextKeyIndex(currentTargetIndex, points);
          const nextKeyTarget = points[nextKeyIdx];
          const nextDist = Math.round(getDistance(uLat, uLon, nextKeyTarget.lat, nextKeyTarget.lon));
          const dirText = getDirectionText(uLat, uLon, nextKeyTarget.lat, nextKeyTarget.lon, heading);
          const nextName = nextKeyTarget.text || `Haupt-Wegpunkt ${nextKeyIdx + 1}`;

          msg += `Nächstes Ziel: ${nextName} in ca. ${nextDist} Metern ${dirText}.`;
          speak(msg);
        } else {
          msg += " Ziel erreicht! Navigation beendet.";
          speak(msg);
          stopNavigation();
        }
      }
    }

    function announceCurrentState() {
      if (!isNavigating || !currentRoute) {
        speak("Navigation ist nicht aktiv.");
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const uLat = pos.coords.latitude;
        const uLon = pos.coords.longitude;
        const heading = pos.coords.heading;
        const points = currentRoute.points;

        // Abweichung prüfen
        let minTrackDist = Infinity;
        for (let i = 0; i < points.length; i++) {
          const d = getDistance(uLat, uLon, points[i].lat, points[i].lon);
          if (d < minTrackDist) minTrackDist = d;
        }

        const keyIdx = getNextKeyIndex(currentTargetIndex, points);
        const keyTarget = points[keyIdx];
        const distToKey = Math.round(getDistance(uLat, uLon, keyTarget.lat, keyTarget.lon));
        const dirText = getDirectionText(uLat, uLon, keyTarget.lat, keyTarget.lon, heading);
        const nameText = keyTarget.text || `Haupt-Wegpunkt ${keyIdx + 1}`;

        if (minTrackDist > OFF_ROUTE_THRESHOLD) {
          speak(`Achtung: Du bist ca. ${Math.round(minTrackDist)} Meter vom Weg abgekommen! Nächster Wegpunkt ${dirText}.`);
        } else {
          speak(`Auf dem Weg. Nächstes Ziel: ${nameText}. Noch ca. ${distToKey} Meter ${dirText}.`);
        }
      }, () => speak("GPS-Signal aktuell nicht verfügbar."));
    }

    function stopNavigation() {
      if (navWatchId !== null) {
        navigator.geolocation.clearWatch(navWatchId);
        navWatchId = null;
      }
      isNavigating = false;
      initialSnapDone = false;
      document.getElementById('startNavBtn').innerText = "Navigation Starten";
      document.getElementById('startNavBtn').className = "btn btn-primary";
      speak("Navigation gestoppt.");
    }

    // --- AUFZEICHNUNG ---
    function prepareRecording() {
      recPoints = [];
      document.getElementById('recToggleBtn').innerText = "Aufnahme Starten";
      document.getElementById('recToggleBtn').className = "btn btn-success";
      document.getElementById('addWaypointBtn').style.display = "none";
      speak("Geben Sie einen Namen ein und drücken Sie 'Aufnahme Starten'.");
    }

    function toggleRecording() {
      if (isRecording) finishRecording();
      else startRecording();
    }

    function startRecording() {
      isRecording = true;
      recPoints = [];
      lastRecPosition = null;

      document.getElementById('recToggleBtn').innerText = "Aufnahme Beenden & Speichern";
      document.getElementById('recToggleBtn').className = "btn btn-danger";
      document.getElementById('addWaypointBtn').style.display = "block";

      speak("Aufnahme gestartet. Gehen Sie jetzt Ihren Weg.");

      recWatchId = navigator.geolocation.watchPosition(
        onRecPosition,
        onGeoError,
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    function onRecPosition(pos) {
      const uLat = pos.coords.latitude;
      const uLon = pos.coords.longitude;

      if (!lastRecPosition) {
        addRecPoint(uLat, uLon, "Startpunkt", true);
        lastRecPosition = { lat: uLat, lon: uLon };
        speak("Startpunkt gespeichert.");
        vibrate(200);
      } else {
        const dist = getDistance(lastRecPosition.lat, lastRecPosition.lon, uLat, uLon);
        if (dist >= REC_DISTANCE_THRESHOLD) {
          addRecPoint(uLat, uLon, "", false); // Stumme Brotkrumen
          lastRecPosition = { lat: uLat, lon: uLon };
          vibrate(80); // Sehr kurzes haptisches Feedback ohne Sprache
        }
      }
    }

    function manualAddWaypoint() {
      if (!isRecording) return;
      navigator.geolocation.getCurrentPosition(pos => {
        const uLat = pos.coords.latitude;
        const uLon = pos.coords.longitude;
        const note = prompt("Hinweis für diesen Haupt-Wegpunkt eingeben (z.B. 'Hier links abbiegen'):", "Besonderer Hinweis");
        addRecPoint(uLat, uLon, note || "Wichtiger Hinweis", true);
        lastRecPosition = { lat: uLat, lon: uLon };
        vibrate([100, 100, 100]);
        speak(`Haupt-Wegpunkt mit Hinweis gespeichert.`);
      }, () => speak("GPS Fehler beim Speichern."));
    }

    function addRecPoint(lat, lon, text, isKey) {
      recPoints.push({ lat: lat, lon: lon, text: text, isKey: !!isKey });
    }

    function finishRecording() {
      if (recWatchId !== null) {
        navigator.geolocation.clearWatch(recWatchId);
        recWatchId = null;
      }
      isRecording = false;

      if (recPoints.length === 0) {
        speak("Keine Punkte aufgezeichnet.");
      } else {
        // Letzten Punkt als Ziel-Hauptwegpunkt markieren
        recPoints[recPoints.length - 1].isKey = true;
        if (!recPoints[recPoints.length - 1].text) {
          recPoints[recPoints.length - 1].text = "Ziel erreicht";
        }

        const routeName = document.getElementById('routeNameInput').value.trim() || `Weg ${routes.length + 1}`;
        routes.push({
          id: Date.now(),
          name: routeName,
          points: recPoints
        });
        localStorage.setItem('navi_routes', JSON.stringify(routes));
        speak(`Weg '${routeName}' erfolgreich gespeichert!`);
      }

      showSection('menuSection');
    }

    function stopRecording() {
      if (recWatchId !== null) {
        navigator.geolocation.clearWatch(recWatchId);
        recWatchId = null;
      }
      isRecording = false;
      speak("Aufnahme abgebrochen.");
    }

    // --- VERWALTUNG & TEILEN ---
    function renderRoutesList() {
      const container = document.getElementById('routesList');
      if (routes.length === 0) {
        container.innerHTML = "<p>Keine Wege gespeichert.</p>";
        speak("Keine gespeicherten Wege vorhanden.");
        return;
      }

      let html = "";
      routes.forEach((r, idx) => {
        html += `
          <div class="route-item">
            <strong>${r.name}</strong> (${r.points.length} Punkte)
            <br><br>
            <button class="btn btn-primary" onclick="selectRoute(${idx})">Navigieren</button>
            <button class="btn btn-warning" onclick="shareRoute(${idx})">Weg Teilen / Senden</button>
            <button class="btn btn-danger" onclick="deleteRoute(${idx})">Löschen</button>
          </div>
        `;
      });
      container.innerHTML = html;
      speak(`${routes.length} gespeicherte Wege geladen.`);
    }

    function selectRoute(idx) {
      currentRoute = routes[idx];
      currentTargetIndex = 0;
      initialSnapDone = false;
      speak(`Weg '${currentRoute.name}' ausgewählt.`);
      showSection('navSection');
    }

    function shareRoute(idx) {
      const route = routes[idx];
      const routeJson = JSON.stringify(route);

      if (navigator.share) {
        navigator.share({
          title: `Weg: ${route.name}`,
          text: routeJson
        }).then(() => speak("Weg-Daten gesendet."))
          .catch(() => copyToClipboard(routeJson));
      } else {
        copyToClipboard(routeJson);
      }
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          speak("Weg wurde als Text-Code in die Zwischenablage kopiert.");
        }).catch(() => {
          prompt("Kopieren Sie diesen Text-Code zum Teilen:", text);
        });
      } else {
        prompt("Kopieren Sie diesen Text-Code zum Teilen:", text);
      }
    }

    function importFromPrompt() {
      const jsonText = prompt("Fügen Sie den empfangenen Weg-Text-Code hier ein:");
      if (!jsonText) return;
      try {
        const imported = JSON.parse(jsonText);
        saveImportedRoute(imported);
      } catch (err) {
        speak("Fehler beim Importieren: Ungültiger Weg-Code.");
      }
    }

    function triggerFileImport() {
      document.getElementById('importFileInput').click();
    }

    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          saveImportedRoute(imported);
        } catch (err) {
          speak("Fehler beim Lesen der Datei.");
        }
      };
      reader.readAsText(file);
    }

    function saveImportedRoute(imported) {
      if (!imported || !imported.name || !imported.points || !Array.isArray(imported.points)) {
        speak("Fehler: Das Datenformat ist nicht gültig.");
        return;
      }
      imported.id = Date.now();
      routes.push(imported);
      localStorage.setItem('navi_routes', JSON.stringify(routes));
      renderRoutesList();
      speak(`Weg '${imported.name}' erfolgreich importiert!`);
    }

    function deleteRoute(idx) {
      const deletedName = routes[idx].name;
      routes.splice(idx, 1);
      localStorage.setItem('navi_routes', JSON.stringify(routes));
      renderRoutesList();
      speak(`Weg '${deletedName}' wurde gelöscht.`);
    }

    function onGeoError(err) {
      speak("GPS-Fehler: Bitte aktivieren Sie den Standort auf Ihrem Smartphone.");
    }
  </script>
</body>
</html>
