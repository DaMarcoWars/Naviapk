<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blinden-Fußgänger-Navi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #000;
      color: #FFF;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 15px;
    }
    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 15px;
      color: #FFD700;
    }
    .status-box {
      background-color: #1a1a1a;
      border: 3px solid #FFD700;
      border-radius: 12px;
      padding: 20px;
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn {
      width: 100%;
      padding: 22px 15px;
      font-size: 1.5rem;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      margin-bottom: 15px;
      cursor: pointer;
      color: #FFF;
      touch-action: manipulation;
    }
    .btn-primary { background-color: #0066CC; }
    .btn-primary:active { background-color: #004488; }
    .btn-success { background-color: #28A745; }
    .btn-success:active { background-color: #1E7E34; }
    .btn-warning { background-color: #D39E00; color: #000; }
    .btn-danger { background-color: #DC3545; }
    .btn-secondary { background-color: #4A5568; }
    .input-field {
      width: 100%;
      padding: 15px;
      font-size: 1.3rem;
      border-radius: 10px;
      border: 2px solid #CCC;
      margin-bottom: 15px;
      background-color: #222;
      color: #FFF;
    }
    .section { display: none; }
    .section.active { display: block; }
    .route-item {
      background: #222;
      border: 2px solid #555;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <h1>Fußgänger Navi</h1>

  <div id="status" class="status-box" role="status" aria-live="assertive">
    Bereit. Bitte wählen Sie eine Aktion.
  </div>

  <!-- Hauptmenü -->
  <div id="menuSection" class="section active">
    <button class="btn btn-primary" onclick="showSection('navSection'); prepareNavigation();">1. Navigation starten</button>
    <button class="btn btn-success" onclick="showSection('recSection'); prepareRecording();">2. Neuen Weg aufzeichnen</button>
    <button class="btn btn-secondary" onclick="showSection('manageSection'); renderRoutesList();">3. Wege verwalten</button>
  </div>

  <!-- Navigation Section -->
  <div id="navSection" class="section">
    <button id="startNavBtn" class="btn btn-primary" onclick="toggleNavigation()">Navigation Starten</button>
    <button class="btn btn-warning" onclick="reverseCurrentRoute()">Weg umkehren (Rückweg)</button>
    <button class="btn btn-warning" onclick="announceCurrentState()">Wo bin ich? (Status ansagen)</button>
    <button class="btn btn-secondary" onclick="stopNavigation(); showSection('menuSection');">Zurück zum Hauptmenü</button>
  </div>

  <!-- Aufzeichnen Section -->
  <div id="recSection" class="section">
    <input type="text" id="routeNameInput" class="input-field" placeholder="Name des Weges" value="Mein Weg">
    <button id="recToggleBtn" class="btn btn-success" onclick="toggleRecording()">Aufnahme Starten</button>
    <button id="addWaypointBtn" class="btn btn-warning" style="display:none;" onclick="manualAddWaypoint()">Wegpunkt / Hinweis hinzufügen</button>
    <button class="btn btn-secondary" onclick="stopRecording(); showSection('menuSection');">Zurück zum Hauptmenü</button>
  </div>

  <!-- Verwalten Section -->
  <div id="manageSection" class="section">
    <h2 style="margin-bottom:10px;">Gespeicherte Wege</h2>
    <button class="btn btn-success" onclick="document.getElementById('importFileInput').click()">+ Weg importieren (Datei öffnen)</button>
    <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importRouteFromFile(event)">
    <div id="routesList" style="margin-top: 15px; margin-bottom: 15px;"></div>
    <button class="btn btn-secondary" onclick="showSection('menuSection');">Zurück zum Hauptmenü</button>
  </div>

  <script>
    // --- KONFIGURATION & ZUSTAND ---
    const REC_DISTANCE_THRESHOLD = 6; // Automatischer Abstand für Wegpunkte in Metern
    let routes = JSON.parse(localStorage.getItem('navi_routes') || '[]');
    let currentRoute = null;
    let isNavigating = false;
    let isRecording = false;
    let navWatchId = null;
    let recWatchId = null;
    let currentTargetIndex = 0;
    let recPoints = [];
    let lastRecPosition = null;
    let initialSnapDone = false;
    let currentCompassHeading = null;

    // --- KOMPASS SENSOR INITIALISIERUNG ---
    function initCompass() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          }
        }).catch(console.error);
      } else {
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        } else if ('ondeviceorientation' in window) {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
      }
    }

    function handleOrientation(event) {
      if (event.webkitCompassHeading) {
        currentCompassHeading = event.webkitCompassHeading;
      } else if (event.alpha !== null && event.alpha !== undefined) {
        currentCompassHeading = (360 - event.alpha) % 360;
      }
    }

    // --- ALLGEMEINE HILFSFUNKTIONEN ---
    function speak(text) {
      document.getElementById('status').innerText = text;
      try {
        if ('speechSynthesis' in window && window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const msg = new SpeechSynthesisUtterance(text);
          msg.lang = 'de-DE';
          msg.rate = 1.0;
          window.speechSynthesis.speak(msg);
        }
      } catch (e) {
        console.log("Sprachausgabe-Fehler:", e);
      }
    }

    function vibrate(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function showSection(sectionId) {
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(sectionId).classList.add('active');
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      const θ = Math.atan2(y, x);
      return (θ * 180 / Math.PI + 360) % 360;
    }

    function getDirectionText(lat1, lon1, lat2, lon2, gpsHeading) {
      const bearing = getBearing(lat1, lon1, lat2, lon2);
      let heading = (gpsHeading !== null && gpsHeading !== undefined && !isNaN(gpsHeading)) 
                    ? gpsHeading 
                    : currentCompassHeading;

      if (heading !== null && heading !== undefined && !isNaN(heading)) {
        let relAngle = (bearing - heading + 360) % 360;
        let clock = Math.round(relAngle / 30);
        if (clock === 0 || clock === 12) clock = 12;
        return `auf ${clock} Uhr`;
      } else {
        return `geradeaus`;
      }
    }

    // --- NAVIGATION ---
    function prepareNavigation() {
      initCompass();
      if (routes.length === 0) {
        speak("Keine gespeicherten Wege vorhanden. Bitte zeichnen Sie zuerst einen Weg auf.");
        showSection('menuSection');
        return;
      }
      currentRoute = routes[routes.length - 1];
      currentTargetIndex = 0;
      initialSnapDone = false;
      speak(`Weg gewählt: ${currentRoute.name}. Bereit zum Starten.`);
    }

    function toggleNavigation() {
      if (isNavigating) stopNavigation();
      else startNavigation();
    }

    function startNavigation() {
      if (!currentRoute || currentRoute.points.length === 0) {
        speak("Fehler: Keine Wegpunkte vorhanden.");
        return;
      }

      isNavigating = true;
      document.getElementById('startNavBtn').innerText = "Navigation Stoppen";
      document.getElementById('startNavBtn').className = "btn btn-danger";
      speak("Suche GPS-Signal. Bitte warten.");

      navWatchId = navigator.geolocation.watchPosition(
        onNavPosition,
        onGeoError,
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    function reverseCurrentRoute() {
      if (!currentRoute) {
        speak("Kein Weg ausgewählt.");
        return;
      }
      currentRoute.points.reverse();
      currentTargetIndex = 0;
      initialSnapDone = false;
      speak("Weg wurde umgekehrt. Start und Ziel sind jetzt vertauscht. Bereit für den Rückweg.");
    }

    function onNavPosition(pos) {
      const uLat = pos.coords.latitude;
      const uLon = pos.coords.longitude;
      const heading = pos.coords.heading;
      const points = currentRoute.points;

      if (!initialSnapDone) {
        let minDist = Infinity;
        let closestIdx = 0;
        for (let i = 0; i < points.length; i++) {
          const d = getDistance(uLat, uLon, points[i].lat, points[i].lon);
          if (d < minDist) {
            minDist = d;
            closestIdx = i;
          }
        }
        currentTargetIndex = closestIdx;
        initialSnapDone = true;
        const dRounded = Math.round(minDist);
        const dirText = getDirectionText(uLat, uLon, points[currentTargetIndex].lat, points[currentTargetIndex].lon, heading);
        speak(`Einstieg bei Wegpunkt ${currentTargetIndex + 1} von ${points.length}. Noch ${dRounded} Meter ${dirText}.`);
        vibrate([100, 50, 100]);
        return;
      }

      const target = points[currentTargetIndex];
      const dist = getDistance(uLat, uLon, target.lat, target.lon);

      if (dist < 7) {
        vibrate([300, 100, 300]);
        let msg = `Wegpunkt ${currentTargetIndex + 1} erreicht. `;
        if (target.text) msg += target.text + ". ";

        if (currentTargetIndex < points.length - 1) {
          currentTargetIndex++;
          const nextTarget = points[currentTargetIndex];
          const nextDist = Math.round(getDistance(uLat, uLon, nextTarget.lat, nextTarget.lon));
          const dirText = getDirectionText(uLat, uLon, nextTarget.lat, nextTarget.lon, heading);
          msg += `Nächster Punkt in ca. ${nextDist} Metern ${dirText}.`;
          speak(msg);
        } else {
          msg += " Ziel erreicht! Navigation beendet.";
          speak(msg);
          stopNavigation();
        }
      }
    }

    function announceCurrentState() {
      if (!isNavigating || !currentRoute) {
        speak("Navigation ist nicht aktiv.");
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const uLat = pos.coords.latitude;
        const uLon = pos.coords.longitude;
        const heading = pos.coords.heading;
        const target = currentRoute.points[currentTargetIndex];
        
        const dist = Math.round(getDistance(uLat, uLon, target.lat, target.lon));
        const dirText = getDirectionText(uLat, uLon, target.lat, target.lon, heading);
        
        speak(`Nächster Punkt: Wegpunkt ${currentTargetIndex + 1}. Noch ca. ${dist} Meter ${dirText}.`);
      }, () => speak("GPS-Signal aktuell nicht verfügbar."));
    }

    function stopNavigation() {
      if (navWatchId !== null) {
        navigator.geolocation.clearWatch(navWatchId);
        navWatchId = null;
      }
      isNavigating = false;
      initialSnapDone = false;
      document.getElementById('startNavBtn').innerText = "Navigation Starten";
      document.getElementById('startNavBtn').className = "btn btn-primary";
      speak("Navigation gestoppt.");
    }

    // --- AUFZEICHNUNG ---
    function prepareRecording() {
      recPoints = [];
      document.getElementById('recToggleBtn').innerText = "Aufnahme Starten";
      document.getElementById('recToggleBtn').className = "btn btn-success";
      document.getElementById('addWaypointBtn').style.display = "none";
      speak("Geben Sie einen Namen ein und drücken Sie 'Aufnahme Starten'.");
    }

    function toggleRecording() {
      if (isRecording) finishRecording();
      else startRecording();
    }

    function startRecording() {
      isRecording = true;
      recPoints = [];
      lastRecPosition = null;

      document.getElementById('recToggleBtn').innerText = "Aufnahme Beenden & Speichern";
      document.getElementById('recToggleBtn').className = "btn btn-danger";
      document.getElementById('addWaypointBtn').style.display = "block";

      speak("Aufnahme gestartet. Gehen Sie jetzt Ihren Weg.");

      recWatchId = navigator.geolocation.watchPosition(
        onRecPosition,
        onGeoError,
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    function onRecPosition(pos) {
      const uLat = pos.coords.latitude;
      const uLon = pos.coords.longitude;

      if (!lastRecPosition) {
        addRecPoint(uLat, uLon, "Startpunkt");
        lastRecPosition = { lat: uLat, lon: uLon };
        speak("Startpunkt gespeichert.");
        vibrate(200);
      } else {
        const dist = getDistance(lastRecPosition.lat, lastRecPosition.lon, uLat, uLon);
        if (dist >= REC_DISTANCE_THRESHOLD) {
          addRecPoint(uLat, uLon, `Wegpunkt ${recPoints.length + 1}`);
          lastRecPosition = { lat: uLat, lon: uLon };
          vibrate(150);
          speak(`Wegpunkt ${recPoints.length} gespeichert.`);
        }
      }
    }

    function manualAddWaypoint() {
      if (!isRecording) return;
      navigator.geolocation.getCurrentPosition(pos => {
        const uLat = pos.coords.latitude;
        const uLon = pos.coords.longitude;
        const note = prompt("Hinweis für diesen Punkt eingeben (z.B. 'Hier links abbiegen'):", "Besonderer Hinweis");
        addRecPoint(uLat, uLon, note || `Wegpunkt ${recPoints.length + 1}`);
        lastRecPosition = { lat: uLat, lon: uLon };
        vibrate([100, 100, 100]);
        speak(`Wegpunkt ${recPoints.length} mit Hinweis gespeichert.`);
      }, () => speak("GPS Fehler beim Speichern."));
    }

    function addRecPoint(lat, lon, text) {
      recPoints.push({ lat: lat, lon: lon, text: text });
    }

    function finishRecording() {
      if (recWatchId !== null) {
        navigator.geolocation.clearWatch(recWatchId);
        recWatchId = null;
      }
      isRecording = false;

      if (recPoints.length === 0) {
        speak("Keine Punkte aufgezeichnet.");
      } else {
        const routeName = document.getElementById('routeNameInput').value.trim() || `Weg ${routes.length + 1}`;
        routes.push({
          id: Date.now(),
          name: routeName,
          points: recPoints
        });
        localStorage.setItem('navi_routes', JSON.stringify(routes));
        speak(`Weg '${routeName}' mit ${recPoints.length} Punkten gespeichert!`);
      }

      showSection('menuSection');
    }

    function stopRecording() {
      if (recWatchId !== null) {
        navigator.geolocation.clearWatch(recWatchId);
        recWatchId = null;
      }
      isRecording = false;
      speak("Aufnahme abgebrochen.");
    }

    // --- VERWALTUNG ---
    function renderRoutesList() {
      const container = document.getElementById('routesList');
      if (routes.length === 0) {
        container.innerHTML = "<p>Keine Wege gespeichert.</p>";
        speak("Keine gespeicherten Wege vorhanden.");
        return;
      }

      let html = "";
      routes.forEach((r, idx) => {
        html += `
          <div class="route-item">
            <strong>${r.name}</strong> (${r.points.length} Punkte)
            <br><br>
            <button class="btn btn-primary" onclick="selectRoute(${idx})">Weg Auswählen & Navigieren</button>
            <button class="btn btn-warning" onclick="exportRoute(${idx})">Weg Teilen / Exportieren</button>
            <button class="btn btn-danger" onclick="deleteRoute(${idx})">Löschen</button>
          </div>
        `;
      });
      container.innerHTML = html;
      speak(`${routes.length} gespeicherte Wege geladen.`);
    }

    function selectRoute(idx) {
      currentRoute = routes[idx];
      currentTargetIndex = 0;
      initialSnapDone = false;
      speak(`Weg '${currentRoute.name}' ausgewählt.`);
      showSection('navSection');
    }

    function deleteRoute(idx) {
      const deletedName = routes[idx].name;
      routes.splice(idx, 1);
      localStorage.setItem('navi_routes', JSON.stringify(routes));
      renderRoutesList();
      speak(`Weg '${deletedName}' wurde gelöscht.`);
    }

    // --- TEILEN & IMPORTIEREN ---
    function exportRoute(idx) {
      const route = routes[idx];
      const dataStr = JSON.stringify(route, null, 2);
      const safeName = route.name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
      const fileName = `${safeName}_route.json`;
      const blob = new Blob([dataStr], { type: 'application/json' });
      const file = new File([blob], fileName, { type: 'application/json' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({
          files: [file],
          title: `Weg: ${route.name}`,
          text: `Hier ist der aufgezeichnete Weg '${route.name}' für die Navi-App.`
        }).then(() => speak("Teilen-Menü geöffnet."))
          .catch(() => speak("Teilen abgebrochen."));
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        a.click();
        speak(`Weg ${route.name} wurde als Datei heruntergeladen.`);
      }
    }

    function importRouteFromFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedRoute = JSON.parse(e.target.result);
          if (!importedRoute.name || !Array.isArray(importedRoute.points)) {
            throw new Error("Ungültiges Format");
          }
          importedRoute.id = Date.now();
          routes.push(importedRoute);
          localStorage.setItem('navi_routes', JSON.stringify(routes));
          renderRoutesList();
          speak(`Weg '${importedRoute.name}' erfolgreich importiert und gespeichert.`);
        } catch (err) {
          speak("Fehler beim Importieren: Ungültiges Dateiformat.");
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function onGeoError(err) {
      speak("GPS-Fehler: Bitte aktivieren Sie den Standort auf Ihrem Smartphone.");
    }
  </script>
</body>
</html>
