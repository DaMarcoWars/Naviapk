<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation für Sehbehinderte</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; }
        .btn { padding: 15px 25px; margin: 5px; font-size: 1.2rem; cursor: pointer; }
        .input-field { padding: 10px; font-size: 1rem; width: 80%; }
        /* A11y Focus States */
        .btn:focus, .input-field:focus {
            outline: 4px solid #FFD700;
            outline-offset: 2px;
        }
        /* Visually Hidden Label */
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
        }
    </style>
</head>
<body>

<main>
    <section aria-labelledby="section-title">
        <h1 id="section-title">Navigations-Assistent</h1>
        
        <label for="routeNameInput" class="sr-only">Name des Weges</label>
        <input type="text" id="routeNameInput" class="input-field" placeholder="Name des Weges" value="Mein Weg">
        
        <button id="recordBtn" class="btn">Weg aufzeichnen</button>
        <button id="navBtn" class="btn">Navigation starten</button>
    </section>

    <section aria-live="assertive" id="status" role="status" style="margin-top: 20px; font-size: 1.5rem; font-weight: bold;">
        Bereit.
    </section>
</main>

<script>
    const AppState = {
        isScreenReaderActive: false, // In der Praxis über Feature-Detection oder Nutzer-Einstellung
        wakeLock: null
    };

    // Hilfsfunktion: Sprachausgabe & DOM-Update
    function speak(text) {
        // Update DOM für Screenreader (aria-live="assertive")
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = text;

        // Eigene Sprachausgabe nur, wenn KEIN Screenreader aktiv ist
        if (!AppState.isScreenReaderActive) {
            const msg = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(msg);
        }
    }

    // GPS Genauigkeits-Check
    function onPositionUpdate(pos) {
        // Schwellenwert: Wenn Genauigkeit > 20 Meter, ignorieren
        if (pos.coords.accuracy > 20) {
            console.warn("GPS Signal zu ungenau:", pos.coords.accuracy);
            return;
        }
        
        // ... Logik für Position ...
        console.log("Position verarbeitet:", pos.coords.latitude, pos.coords.longitude);
    }

    // Wake Lock Re-Activation
    async function keepScreenAwake() {
        try {
            AppState.wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {
            console.error("Wake Lock konnte nicht aktiviert werden");
        }
    }

    document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible' && AppState.wakeLock !== null) {
            await keepScreenAwake();
        }
    });

</script>
</body>
</html>
